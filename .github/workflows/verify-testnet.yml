# PIKIT 외부 감시자 — 테스트넷 (명세 17 P0-7 · P0-16 c·d, 리뷰 rev6 H-1, D163, docs/VERIFY.md §7). 본체는 _verify.yml.
# 매시간(VM) 또는 6시간마다(호스팅): 앞 성공 실행의 verify-state(산출물 verify-<망>-state-<계약 주소 앞 10자> — 계약이 바뀌면 처음부터, D218)에서 이어 받아 체인 마지막 앵커까지 검증(공백 없음), 실패면 Discord(있으면) + 빨간 체크.
# GitHub 호스트 러너(우리 GCP 밖)가 공개 자료만 읽는다: 공개 에폭 파일과 서로 다른 공급자의 공개 RPC 두 곳.
# 저장소 변수: VERIFY_TESTNET_CONTRACT(필수 — PikitLedger 주소, 사람이 고정, 개정 7 D201) · (선택) VERIFY_TESTNET_LEDGER_HASH · VERIFY_TESTNET_FILES_URL ·
#   VERIFY_TESTNET_RPC_URLS(쉼표로 두 곳, 서로 다른 공급자) · VERIFY_MAX_RPS · VERIFY_MAX_ROOTS. 비밀값: VERIFY_ALERT_WEBHOOK(선택, Discord 웹훅 URL).
# 주의: 검증기는 부른 ref 의 엔진으로 빌드된다 — 변수의 테스트넷 장부가 그 엔진의 rulesHash 가 아니면 빌드 불일치로 실패한다(main = 규칙 9, D229:
#   규칙 9 스테이징 장부(staging:up --fresh)로 VERIFY_TESTNET_CONTRACT 를 바꾼 뒤부터 초록).
name: verify-testnet

# 러너(2026-10-12, 호스팅 분 절약 — docs/VERIFY.md §7.3): 기본은 테스트넷 VM 의 self-hosted 러너(pikit-testnet)에서 매시간.
#   저장소 변수 VERIFY_RUNNER=hosted 면 GitHub 호스팅 러너에서 6시간마다(이어 받기라 공백은 없고 늦게 잡을 뿐). 포크(외부 감시자)는 hosted 로 둔다.
#   두 cron 중 지금 러너에 맞는 것만 잡을 띄운다(다른 것은 건너뜀 = 분 0).
on:
  schedule:
    - cron: "17 * * * *"     # 매시간 17분 (UTC) — self-hosted 일 때
    - cron: "47 */6 * * *"   # 6시간마다 47분 (UTC) — VERIFY_RUNNER=hosted 일 때
  workflow_dispatch:
    inputs:
      runner:
        description: "self-hosted = testnet VM runner (no hosted minutes), hosted = GitHub-hosted (ubuntu-latest). auto = repository variable VERIFY_RUNNER, else self-hosted"
        type: choice
        options: [auto, self-hosted, hosted]
        default: auto

# 끊지 않는다 — 성공한 실행만 상태를 올리므로 도중에 끊으면 그만큼 다시 한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: (github.event_name != 'schedule' || (github.event.schedule == '17 * * * *') == (((inputs.runner != 'auto' && inputs.runner) || vars.VERIFY_RUNNER || 'self-hosted') != 'hosted'))
    uses: ./.github/workflows/_verify.yml
    with:
      network: testnet
      contract: ${{ vars.VERIFY_TESTNET_CONTRACT }}
      ledger_hash: ${{ vars.VERIFY_TESTNET_LEDGER_HASH || '' }}
      files_url: ${{ vars.VERIFY_TESTNET_FILES_URL || 'https://chog.pikit.fun/epochs' }}
      rpc_urls: ${{ vars.VERIFY_TESTNET_RPC_URLS || 'https://testnet-rpc.monad.xyz,https://rpc.ankr.com/monad_testnet' }}
      max_rps: ${{ vars.VERIFY_MAX_RPS || '20' }}
      max_roots: ${{ vars.VERIFY_MAX_ROOTS || (((inputs.runner != 'auto' && inputs.runner) || vars.VERIFY_RUNNER || 'self-hosted') == 'hosted' && '2' || '5') }}
      runner: ${{ ((inputs.runner != 'auto' && inputs.runner) || vars.VERIFY_RUNNER || 'self-hosted') != 'hosted' && 'pikit-testnet' || '' }}
    secrets:
      VERIFY_ALERT_WEBHOOK: ${{ secrets.VERIFY_ALERT_WEBHOOK }}
